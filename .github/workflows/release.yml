name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch: {}

permissions:
  contents: write
  packages: write

jobs:
  windows-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package + build deps
        run: |
          python -m pip install --upgrade pip
          pip install .
          pip install pyinstaller

      - name: Build bpdl-web.exe (web UI)
        run: >
          pyinstaller --onefile --name bpdl-web
          --collect-all fastapi --collect-all starlette --collect-all uvicorn
          --collect-all numpy
          --add-data "bpdl/webui/static;bpdl/webui/static"
          scripts/win_bpdl_web.py

      # bpdl-web.exe is self-contained: PyInstaller pulls imageio-ffmpeg's binary in
      # with the package, so the fake-lossless checker decodes audio on a machine that
      # has never heard of ffmpeg, with nothing to install and no second copy to ship.
      # A user who wants their own build can still drop an ffmpeg.exe beside the exe or
      # set BPDL_FFMPEG — spectral.ffmpeg_exe() prefers both over the bundled one.
      # Redistributing an ffmpeg build means shipping its notice, hence the third-party file.
      - name: Stage Windows release bundle
        run: |
          mkdir dist\windows-bundle
          copy dist\bpdl-web.exe dist\windows-bundle\
          copy README.md dist\windows-bundle\
          copy THIRD-PARTY-NOTICES.txt dist\windows-bundle\
          dir dist\windows-bundle

      # Proves the bundle actually runs before it is published. numpy and the ffmpeg
      # lookup are exactly the things a PyInstaller build breaks silently, and
      # /api/transcode/status reports on both without needing Beatport credentials.
      - name: Smoke-test the bundle
        working-directory: dist/windows-bundle
        shell: pwsh
        run: |
          $p = Start-Process -FilePath .\bpdl-web.exe -PassThru -WindowStyle Hidden
          try {
            $ok = $false
            foreach ($i in 1..30) {
              Start-Sleep -Seconds 2
              try {
                $r = Invoke-RestMethod -Uri http://127.0.0.1:8095/api/transcode/status -TimeoutSec 5
                if (-not $r.ffmpeg) { throw "the bundled ffmpeg was not found by the exe" }
                Write-Host "status ok, ffmpeg at $($r.ffmpeg_path)"
                $ok = $true
                break
              } catch [System.Net.WebException] { }
                catch { if ($_.Exception.Message -like "*ffmpeg*") { throw } }
            }
            if (-not $ok) { throw "bpdl-web.exe never answered on :8095" }
          } finally {
            Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
          }

      - uses: actions/upload-artifact@v4
        with:
          name: beatportdl-webui-windows-x64
          path: dist/windows-bundle/**

  docker-multiarch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push multi-arch image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/beatportdl-webui:latest
            ghcr.io/${{ github.repository_owner }}/beatportdl-webui:${{ github.ref_name }}

  github-release:
    needs: [windows-build, docker-multiarch]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: beatportdl-webui-windows-x64
          path: windows-bundle

      - name: Zip Windows bundle
        run: cd windows-bundle && zip -r ../beatportdl-webui-windows-x64.zip .

      - uses: softprops/action-gh-release@v2
        with:
          files: beatportdl-webui-windows-x64.zip
          generate_release_notes: true
